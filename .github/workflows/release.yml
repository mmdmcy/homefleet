name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: make release-local

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/homefleet_linux_amd64
            dist/homefleet_linux_arm64
            dist/homefleet_darwin_amd64
            dist/homefleet_darwin_arm64
            dist/homefleet_windows_amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
